<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noche de Juegos — Parqués y Dominó</title>

<!-- PWA: permite instalar el hub como app en el celular -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1f16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noche de Juegos">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hub.css">
<link rel="stylesheet" href="css/parques.css">
<link rel="stylesheet" href="css/domino.css">
<link rel="stylesheet" href="css/naipes.css">
<link rel="stylesheet" href="css/uno.css">
<link rel="stylesheet" href="css/ahorcado.css">
<link rel="stylesheet" href="css/generala.css">
<link rel="stylesheet" href="css/trivia.css">
<link rel="stylesheet" href="css/casino.css">
<link rel="stylesheet" href="css/sietezero.css">
<link rel="stylesheet" href="css/quiniela.css">
<link rel="stylesheet" href="css/bingo.css">
<link rel="stylesheet" href="css/penales.css">
<link rel="stylesheet" href="css/blackjack.css">
<link rel="stylesheet" href="css/rummikub.css">

<script>
  // Se ejecuta antes de pintar la página para evitar el "flash" del tema incorrecto.
  (function () {
    try {
      var raw = localStorage.getItem('noche-de-juegos:theme');
      var theme = raw ? JSON.parse(raw) : 'dark';
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) { /* no-op */ }
  })();
</script>
</head>
<body>

<!-- ============ HUB: estantería de juegos ============ -->
<section id="screen-hub" class="screen active">
  <header class="hub-header">
    <div class="hub-title">
      <div class="dice-mark" aria-hidden="true">
        <div class="cube">
          <div class="face f1"><span></span><span></span><span></span><span></span><span class="pip"></span><span></span><span></span><span></span><span></span></div>
          <div class="face f2"><span class="pip"></span><span></span><span class="pip"></span><span></span><span></span><span></span><span class="pip"></span><span></span><span class="pip"></span></div>
          <div class="face f3"><span class="pip"></span><span></span><span></span><span></span><span class="pip"></span><span></span><span></span><span></span><span class="pip"></span></div>
          <div class="face f4"><span class="pip"></span><span></span><span class="pip"></span><span></span><span></span><span></span><span class="pip"></span><span></span><span class="pip"></span></div>
          <div class="face f5"><span class="pip"></span><span></span><span class="pip"></span><span></span><span class="pip"></span><span></span><span class="pip"></span><span></span><span class="pip"></span></div>
          <div class="face f6"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span></span><span></span><span></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
        </div>
      </div>
      <div>
        <span class="eyebrow">Sala de juegos de mesa</span>
        <h1>Noche de Juegos</h1>
      </div>
    </div>
    <div class="hub-header-right">
      <div class="hub-stats" id="hub-stats"></div>
      <div class="hub-icon-actions">
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Cambiar a tema claro">
          <svg id="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
        <button type="button" class="icon-btn" id="fullscreen-toggle" aria-label="Pantalla completa" hidden>
          <svg id="fullscreen-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="hub-toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="search-input" placeholder="Buscar un juego..." aria-label="Buscar un juego">
    </div>
    <div class="chip-row" id="category-chips"></div>
  </div>

  <div class="recent-section" id="recent-section" hidden>
    <h3 class="section-label">Jugados recientemente</h3>
    <div class="recent-row" id="recent-row"></div>
  </div>

  <div class="shelf" id="shelf"></div>
  <p class="empty-state" id="empty-state" hidden>No encontramos ningún juego con esos filtros. Probá con otra búsqueda o categoría.</p>
</section>

<!-- ============ Pantalla de un juego en curso ============ -->
<section id="screen-game" class="screen">
  <div class="screen-inner" id="game-container"></div>
</section>

<!-- ============ Overlay de configuración de partida ============ -->
<div class="setup-overlay" id="setup-overlay" hidden>
  <div class="panel setup-card" id="setup-card"></div>
</div>

<!-- Núcleo -->
<script src="js/core/event-bus.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/dice.js"></script>
<script src="js/core/autoplay.js"></script>

<!-- Trivia -->

<script src="js/games/trivia/trivia-ui.js"></script>

<script src="js/games/ruleta/ruleta-ui.js"></script>

<!-- Tragamonedas -->
<script src="js/games/tragamonedas/tragamonedas-engine.js"></script>
<script src="js/games/tragamonedas/tragamonedas-ui.js"></script>

<!-- Selección de Ensueño -->
<script src="js/games/sietezero/sietezero-data.js"></script>
<script src="js/games/sietezero/sietezero-engine.js"></script>
<script src="js/games/sietezero/sietezero-missions.js"></script>

<!-- Hub -->
<script src="js/app.js"></script>

<!-- Registro del Service Worker (offline + instalación como app) -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        console.warn("No se pudo registrar el service worker:", err);
      });
    });
  }
</script>
</body>
</html>
